[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "personal-state-mcp"
version = "0.4.0"
description = "Local read-only MCP server for selective physiological context."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Personal State MCP" }]
dependencies = ["tzdata>=2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
mcp = ["mcp[cli]>=2.0.0"]
keychain = ["keyring>=25.0"]
dev = ["pytest>=8.3"]

[project.scripts]
personal-state = "personal_state_mcp.cli:main"
personal-state-mcp = "personal_state_mcp.mcp_server:main"
personal-state-dashboard = "personal_state_mcp.dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_state_mcp"]
